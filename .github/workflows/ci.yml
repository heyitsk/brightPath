name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: brightpath
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: brightpath
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U brightpath" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      LOG_LEVEL: silent
      CORS_ORIGIN: http://localhost:5173
      DATABASE_URL: postgresql://brightpath:ci-password@localhost:5432/brightpath_test?schema=public
      REDIS_URL: redis://localhost:6379/1
      RATE_LIMIT_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile --cwd backend
      - run: bun install --frozen-lockfile --cwd frontend
      - run: bun run --cwd backend db:generate
      - run: bun run --cwd backend typecheck
      - run: bun run --cwd backend test
      # The committed API contract must match the code. If this fails, run `bun run gen:api` and commit.
      - name: OpenAPI contract is up to date
        run: |
          bun run gen:api
          git diff --exit-code docs/openapi.json frontend/src/api/schema.d.ts
